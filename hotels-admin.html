<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ホテル管理（デモ）</title><style>body{margin:0;background:#1a1c1f;color:#fff;font-family:system-ui,sans-serif}main{max-width:740px;margin:auto;padding:24px 16px 90px}h1{font-size:24px}p{color:#ccc}label{display:block;margin:14px 0 5px}input{box-sizing:border-box;width:100%;background:#303238;color:white;border:1px solid #686b70;border-radius:8px;padding:12px;font-size:16px}button,.link{display:inline-block;background:linear-gradient(#a66b7e,#47151d);border:0;border-radius:8px;color:white;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none;margin:12px 6px 0 0}button.green{background:linear-gradient(#c5a15a,#143526)}.item{border:1px solid #555;border-radius:10px;padding:15px;margin:15px 0;background:#292c31}.item h3{margin:0}.small{font-size:13px;color:#bbb}.row{display:flex;gap:10px;flex-wrap:wrap}a{color:#b8e9ce}</style></head><body><main><a href="index.html#hotels">← ホテルリストに戻る</a><h1>ホテル情報管理（デモ）</h1><p>写真・料金目安・住所・電話番号を登録すると、同じブラウザのトップページに反映されます。</p><p class="small">※ ブラウザ内保存の試作版です。ログイン認証・共有データベースは未実装です。個人情報は登録しないでください。写真は使用許可のあるものだけ登録してください。</p><form id="form"><input type="hidden" id="editId"><label>ホテル名 *</label><input id="name" required maxlength="100"><label>料金目安</label><input id="price" placeholder="例：料金は施設へご確認ください" maxlength="100"><label>住所</label><input id="address" placeholder="Googleマップ検索に使用" maxlength="250"><label>電話番号</label><input id="phone" type="tel" maxlength="30"><label>写真（小さめの画像を推奨）</label><input id="photoFile" type="file" accept="image/png,image/jpeg,image/webp"><label>または画像URL（https）</label><input id="photoUrl" type="url" placeholder="https://..."><label><input id="visible" type="checkbox" checked style="width:auto"> 公開する</label><button class="green" type="submit">保存する</button><button type="button" id="reset">入力をクリア</button></form><h2>登録済みホテル</h2><div id="list"></div></main><script>
const KEY='happening_hotels_v1';let hotels=[];try{hotels=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}if(!Array.isArray(hotels))hotels=[];
const $=id=>document.getElementById(id);const fields=['name','price','address','phone'];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(hotels));render()}catch(e){alert('保存容量を超えました。写真を小さくしてください。')}}
function clear(){ $('form').reset();$('editId').value='';$('photoUrl').value='';}
function render(){const root=$('list');root.replaceChildren();if(!hotels.length){root.textContent='まだ登録されていません。';return}hotels.forEach(h=>{const d=document.createElement('div');d.className='item';const title=document.createElement('h3');title.textContent=h.name;d.append(title);const p=document.createElement('p');p.textContent=[h.price,h.address,h.visible===false?'非公開':'公開'].filter(Boolean).join(' / ');d.append(p);const edit=document.createElement('button');edit.textContent='編集';edit.onclick=()=>{fields.forEach(k=>$(k).value=h[k]||'');$('editId').value=h.id;$('visible').checked=h.visible!==false;$('photoUrl').value=h.photo?.startsWith('https://')?h.photo:'';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.textContent='削除';del.onclick=()=>{if(confirm('削除しますか？')){hotels=hotels.filter(x=>x.id!==h.id);persist()}};d.append(edit,del);root.append(d)})}
$('reset').onclick=clear;
$('form').onsubmit=async e=>{e.preventDefault();const id=$('editId').value||String(Date.now());const previous=hotels.find(x=>x.id===id);let photo=previous?.photo||'';const file=$('photoFile').files[0];if(file){if(file.size>350000){alert('画像は350KB以下に圧縮してください。');return}photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}else if($('photoUrl').value.trim())photo=$('photoUrl').value.trim();const h={id,photo,visible:$('visible').checked};fields.forEach(k=>h[k]=$(k).value.trim());if(!h.name)return;hotels=hotels.filter(x=>x.id!==id);hotels.push(h);persist();clear()};render();
</script></body></html>
