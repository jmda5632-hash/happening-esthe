<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>広告管理 | ハプニングエステ デモ</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#1a1c1f;color:#fff;font-family:system-ui,sans-serif;margin:0}main{max-width:940px;margin:auto;padding:22px 16px 80px}a{color:#9dd6b6}h1{font-size:25px}.note{padding:14px;border:1px solid #805b2b;background:#33291f;border-radius:9px;line-height:1.7;font-size:13px}.panel{background:#292c31;padding:18px;border-radius:12px;margin-top:20px}label{display:block;font-size:13px;margin:12px 0 5px}input,textarea{width:100%;background:#17191c;color:white;border:1px solid #686b71;border-radius:6px;padding:11px;font:inherit}input[type=checkbox]{width:auto}input[type=file]{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{background:#a66b7e;color:#fff;border:0;border-radius:7px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}.green{background:#c5a15a}.muted{background:#51545a}.danger{background:#7f2831}.item{padding:14px;border:1px solid #555;border-radius:8px;margin:9px 0}.item img{width:110px;height:65px;object-fit:cover;border-radius:5px;float:right}.small{font-size:12px;color:#b7bac0}#status{min-height:22px;color:#a8e3bb}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="index.html">← トップページに戻る</a><h1>広告バナー管理</h1><div class="note"><strong>試作版の管理画面です。</strong>変更はこのブラウザの保存領域だけに保存され、別の端末には反映されません。ログイン認証・サーバー保存は未実装です。実店舗で公開運用する前に認証付き管理画面とデータベースが必要です。</div><section class="panel"><h2>登録済み広告</h2><div id="items"></div><button class="btn green" id="new">＋ 新規広告を追加</button><button class="btn muted" id="reset">サンプルに戻す</button></section><section class="panel"><h2 id="formTitle">広告を登録</h2><form id="form"><input type="hidden" id="id"><div class="grid"><div><label for="title">広告タイトル *</label><input id="title" required maxlength="90"></div><div><label for="subtitle">ラベル</label><input id="subtitle" maxlength="40" placeholder="SPECIAL EVENT"></div></div><label for="description">説明文</label><textarea id="description" rows="3" maxlength="220"></textarea><div class="grid"><div><label for="url">リンク先（https:// または #events など）</label><input id="url" value="#events" required></div><div><label for="order">表示順（小さい数字が先）</label><input id="order" type="number" value="1" min="0" max="9999"></div><div><label for="start">掲載開始日（空欄なら制限なし）</label><input id="start" type="date"></div><div><label for="end">掲載終了日（空欄なら制限なし）</label><input id="end" type="date"></div></div><label for="image">広告画像（JPEG/PNG/WebP、1MB以下）</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><p class="small">画像を変更しない場合は未選択で保存。大きな画像は保存容量の制限を受けます。</p><label><input id="enabled" type="checkbox" checked> 公開する</label><p><button class="btn green" type="submit">広告を保存</button><button class="btn muted" type="button" id="clear">入力をクリア</button></p><div id="status" role="status"></div></form></section></main><script>
const KEY='happening_ads_v1';const defaults=[{id:'a',title:'期間限定イベント',subtitle:'SPECIAL EVENT',description:'最新イベントや特別企画を大きく紹介できます。',url:'#events',image:'',start:'',end:'',order:1,enabled:true},{id:'b',title:'新着キャスト情報',subtitle:'NEW CAST',description:'注目のキャストをトップでアピール。',url:'#cast',image:'',start:'',end:'',order:2,enabled:true},{id:'c',title:'キャンペーン情報',subtitle:'CAMPAIGN',description:'期間限定のお知らせを目立つ場所に掲載。',url:'#events',image:'',start:'',end:'',order:3,enabled:true}];
let ads;try{ads=JSON.parse(localStorage.getItem(KEY))??structuredClone(defaults);if(!Array.isArray(ads))ads=structuredClone(defaults)}catch{ads=structuredClone(defaults)}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(ads));return true}catch{$('status').textContent='保存容量を超えました。画像を小さくしてください。';return false}}function clear(){ $('form').reset();$('id').value='';$('order').value=ads.length+1;$('formTitle').textContent='広告を登録';$('status').textContent=''}function render(){const el=$('items');el.replaceChildren();ads.slice().sort((a,b)=>a.order-b.order).forEach(a=>{const box=document.createElement('div');box.className='item';if(a.image){const img=document.createElement('img');img.src=a.image;img.alt='広告画像';box.append(img)}const title=document.createElement('strong');title.textContent=a.title;const meta=document.createElement('p');meta.className='small';meta.textContent=`順番 ${a.order} ｜ ${a.enabled?'公開':'非公開'} ｜ ${a.start||'開始指定なし'} ～ ${a.end||'終了指定なし'}`;const edit=document.createElement('button');edit.className='btn muted';edit.textContent='編集';edit.onclick=()=>{['id','title','subtitle','description','url','order','start','end'].forEach(k=>$(k).value=a[k]??'');$('enabled').checked=!!a.enabled;$('formTitle').textContent='広告を編集';$('form').scrollIntoView({behavior:'smooth'})};const del=document.createElement('button');del.className='btn danger';del.textContent='削除';del.onclick=()=>{if(confirm('この広告を削除しますか？')){ads=ads.filter(x=>x.id!==a.id);if(save()){render();clear()}}};box.append(title,meta,edit,del);el.append(box)});if(!ads.length)el.textContent='広告がありません'}
$('form').onsubmit=async e=>{e.preventDefault();const url=$('url').value.trim();if(!(url.startsWith('#')||url.startsWith('/')&&!url.startsWith('//')||/^https:\/\//i.test(url))){$('status').textContent='リンク先は https://、/ または # で始めてください';return}if($('start').value&&$('end').value&&$('start').value>$('end').value){$('status').textContent='終了日を開始日以降にしてください';return}const old=ads.find(a=>a.id===$('id').value);let image=old?.image||'';const file=$('image').files[0];if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>1024*1024){$('status').textContent='JPEG/PNG/WebPの1MB以下の画像を選んでください';return}image=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}const a={id:old?.id||('ad-'+Date.now()),title:$('title').value.trim(),subtitle:$('subtitle').value.trim(),description:$('description').value.trim(),url,image,order:Number($('order').value)||0,start:$('start').value,end:$('end').value,enabled:$('enabled').checked};const previous=ads.slice();ads=old?ads.map(x=>x.id===a.id?a:x):[...ads,a];if(save()){render();clear();$('status').textContent='保存しました。トップページを再読み込みすると反映されます。'}else ads=previous};$('new').onclick=()=>{clear();$('form').scrollIntoView({behavior:'smooth'})};$('clear').onclick=clear;$('reset').onclick=()=>{if(confirm('広告をサンプル3件に戻しますか？')){ads=structuredClone(defaults);if(save()){render();clear()}}};render();
</script></body></html>
